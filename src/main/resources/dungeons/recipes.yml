  players: 6-10
  key: m.loot.trial_key
  lives: 8
  mob-level: 1
  health-per-extra-player: 0.4
  enemies-per-extra-player: 0.35
  tier: 1
  boss-health: 2.5
  min-room-cells: 4
  health-cap: 10
  max-depth: 5
  event-chance: 0.4
  max-events: 4
  minutes: 50
  par: 38
  difficulties:
    normal: {name: Normal, tier: 1, bank: {every: 2, rest: true, keep: 1.0, treasure: true, exit: 0.5}, advice: "Made for this act's roleplay gear."}
    hard: {name: Hard, tier: 2, health: 1.5, damage: 1.25, needs: normal, bank: {rest: true, keep: 0.5, treasure: true, exit: 0.5}, minutes: 62, par: 47, advice: "Made for rare dungeon gear."}
    nightmare: {name: Nightmare, tier: 3, health: 2.2, damage: 1.6, needs: hard, bank: {keep: 0, exit: 0.5}, minutes: 75, par: 57, advice: "Made for epic and legendary dungeon gear."}
    mythic: {name: Mythic, tier: 4, health: 3.0, damage: 2.0, needs: nightmare, bank: {keep: 0, exit: 0.5}, gear-at-risk: true, boost: 2.0, minutes: 90, par: 68, advice: "For the best-geared: your worn dungeon gear is at stake."}
