# Dungeon recipes: how each dungeon type is laid out. Shipped once; never overwritten.
# trunk: rooms between the start room and the boss (rest room not counted), as N or MIN-MAX.
# trunk-pool / branch-pool: room types with relative weights.
# branches: side branches off the trunk; each ends in a treasure room.
# branch-length: rooms per branch, the treasure room included.
# attempts / step-budget: how hard the generator tries before giving up on a seed.
# players: how many players a gate lets in, as N or MIN-MAX.
# key: TLibs item path the gate takes from the leader (blank for none).
# lives: shared lives; each bleed-out spends one, then a player is out.
# mob-level: enemy level.
# health-per-extra-player / enemies-per-extra-player: for each player after the first, enemies get this
#   much more health and fights this much more threat budget (more enemies), as fractions. Party size
#   never changes enemy damage.
# tier: difficulty from 1: bigger fights (the kit's tier-factors) and harder boss mechanics.
# boss: which of the kit's bosses ends the dungeon (blank for the kit's first).
# event-chance: chance that a plain fight room gets one of the kit's room events (0 = none).
# max-events: the most room events in one dungeon.
delve_greybox:
  kit: greybox
  trunk: 3-5
  trunk-pool:
    combat: 3
    elite: 1
    corridor: 1
  rest-before-boss: true
  vault: true
  branches: 1-2
  branch-length: 1-2
  branch-pool:
    combat: 2
    corridor: 1
  attempts: 20
  step-budget: 20000
  players: 1-3
  key: m.loot.trial_key
  lives: 3
  mob-level: 1
  health-per-extra-player: 0.5
  enemies-per-extra-player: 0.25
  tier: 1
  boss: bone_warden

# The Seithr dungeon: ice and dark stone, the Seithr Fortress enemies.
delve_seithr:
  kit: seithr
  trunk: 6-9
  trunk-pool:
    combat: 3
    elite: 1
    corridor: 2
  rest-before-boss: true
  vault: true
  branches: 1-3
  branch-length: 1-2
  branch-pool:
    combat: 2
    corridor: 1
  attempts: 20
  step-budget: 20000
  players: 1-3
  key: m.loot.trial_key
  lives: 3
  mob-level: 1
  health-per-extra-player: 0.5
  enemies-per-extra-player: 0.25
  tier: 1
  boss: ice_golem
  event-chance: 0.4
  max-events: 2
  # How long a proper party takes for a run, in minutes: its spoils (act materials and rare items
  # that leave the dungeon) pay that much play at the act system's hourly budgets, a share for each
  # fight room cleared. 0 or none: no spoils. A difficulty can give its own.
  minutes: 20
  # Par time in minutes: reaching the vault within it gives a better vault (extra marks and luck, see
  # loot.yml rewards par:). A difficulty can give its own.
  par: 15
  # Chosen at the gate. tier: the run's tier (bigger fights, harder boss mechanics, loot of that
  # tier); health and damage: enemy multipliers on top of the party's; needs: the difficulty the
  # leader must have won here first. Normal is made for this act's roleplay gear.
  difficulties:
    normal: {name: Normal, tier: 1, advice: "Made for this act's roleplay gear."}
    hard: {name: Hard, tier: 2, health: 1.5, damage: 1.25, needs: normal, minutes: 25, par: 20, advice: "Made for rare dungeon gear."}
    nightmare: {name: Nightmare, tier: 3, health: 2.2, damage: 1.6, needs: hard, minutes: 30, par: 25, advice: "Made for epic and legendary dungeon gear."}
