# Dungeon recipes: how each dungeon type is laid out. Shipped once; never overwritten.
# trunk: rooms between the start room and the boss (rest room not counted), as N or MIN-MAX.
# trunk-pool / branch-pool: room types with relative weights.
# branches: side branches off the trunk; each ends in a treasure room.
# branch-length: rooms per branch, the treasure room included.
# attempts / step-budget: how hard the generator tries before giving up on a seed.
# players: how many players a gate lets in, as N or MIN-MAX.
# key: TLibs item path the gate takes from the leader (blank for none).
# lives: shared lives; each bleed-out spends one, then a player is out.
# mob-level: enemy level.
# health-per-extra-player / enemies-per-extra-player: for each player after the first, enemies get this
#   much more health and fights this much more threat budget (more enemies), as fractions. Party size
#   never changes enemy damage.
# tier: difficulty from 1: bigger fights (the kit's tier-factors) and harder boss mechanics.
# boss: which of the kit's bosses ends the dungeon (blank: one of the kit's bosses for the difficulty).
# event-chance: chance that a plain fight room gets one of the kit's room events (0 = none).
# max-events: the most room events in one dungeon.
delve_greybox:
  kit: greybox
  trunk: 3-5
  trunk-pool:
    combat: 3
    elite: 1
    corridor: 1
  rest-before-boss: true
  vault: true
  branches: 1-2
  branch-length: 1-2
  branch-pool:
    combat: 2
    corridor: 1
  attempts: 20
  step-budget: 20000
  players: 1-3
  key: m.loot.trial_key
  lives: 3
  mob-level: 1
  health-per-extra-player: 0.5
  enemies-per-extra-player: 0.25
  tier: 1
  boss: bone_warden

# The Seithr dungeon: ice and dark stone, the Seithr Fortress enemies.
delve_seithr:
  kit: seithr
  trunk: 6-9
  trunk-pool:
    combat: 3
    elite: 1
    corridor: 2
  rest-before-boss: true
  vault: true
  branches: 1-3
  branch-length: 1-2
  branch-pool:
    combat: 2
    corridor: 1
  attempts: 20
  step-budget: 20000
  players: 1-3
  key: m.loot.trial_key
  lives: 3
  mob-level: 1
  health-per-extra-player: 0.5
  enemies-per-extra-player: 0.25
  tier: 1
  event-chance: 0.4
  max-events: 2
  # How long a proper party takes for a run, in minutes: its spoils (act materials and rare items
  # that leave the dungeon) pay that much play at the act system's hourly budgets, a share for each
  # fight room cleared. 0 or none: no spoils. A difficulty can give its own.
  minutes: 20
  # Par time in minutes: reaching the vault within it gives a better vault (extra marks and luck, see
  # loot.yml rewards par:). A difficulty can give its own.
  par: 15
  # Chosen at the gate. tier: the run's tier (bigger fights, harder boss mechanics, loot of that
  # tier); health and damage: enemy multipliers on top of the party's; needs: the difficulty the
  # leader must have won here first. Normal is made for this act's roleplay gear.
  # bank: what players find is carried; a save point banks it (every: after every so many cleared
  # fight rooms; rest: on reaching the rest room); falling loses what is carried. If the boss falls
  # everything comes home; if the run fails each banked find comes home with the chance keep.
  # treasure: reaching a treasure room (a detour on a branch) banks too. exit: the chance each
  # treasure room holds a way out, where each player may leave alone with finds worth up to half of what
  # they would lose (or their best find). No bank section: finds are paid at once. gear-at-risk: falling destroys the dungeon gear worn.
  # boost: item chances and marks multiplied for the risk.
  difficulties:
    normal: {name: Normal, tier: 1, bank: {every: 2, rest: true, keep: 1.0, treasure: true, exit: 0.5}, advice: "Made for this act's roleplay gear."}
    hard: {name: Hard, tier: 2, health: 1.5, damage: 1.25, needs: normal, bank: {rest: true, keep: 0.5, treasure: true, exit: 0.5}, minutes: 25, par: 20, advice: "Made for rare dungeon gear."}
    nightmare: {name: Nightmare, tier: 3, health: 2.2, damage: 1.6, needs: hard, bank: {keep: 0, exit: 0.5}, minutes: 30, par: 25, advice: "Made for epic and legendary dungeon gear."}
    mythic: {name: Mythic, tier: 4, health: 3.0, damage: 2.0, needs: nightmare, bank: {keep: 0, exit: 0.5}, gear-at-risk: true, boost: 2.0, minutes: 36, par: 30, advice: "For the best-geared: your worn dungeon gear is at stake."}

# The Seithr dungeon for a full party (3-5): longer, only roomier fight rooms (min-room-cells: the
# fewest cells a fight room fills) and a tougher boss (boss-health: its health on top of the party's).
dungeon_seithr:
  kit: seithr
  trunk: 9-12
  trunk-pool:
    combat: 3
    elite: 1
    corridor: 2
  rest-before-boss: true
  vault: true
  branches: 2-3
  branch-length: 1-2
  branch-pool:
    combat: 2
    corridor: 1
  attempts: 20
  step-budget: 30000
  players: 3-5
  key: m.loot.trial_key
  lives: 5
  mob-level: 1
  health-per-extra-player: 0.5
  enemies-per-extra-player: 0.3
  tier: 1
  boss-health: 1.5
  min-room-cells: 2
  # health-cap: the most an enemy's health is multiplied by (party and elite; 0 or none = the kit's);
  # max-depth: fights grow with each cleared room up to this many (long runs stay within the
  # enemy cap; 0 or none = no limit).
  health-cap: 6
  max-depth: 8
  event-chance: 0.4
  max-events: 3
  minutes: 35
  par: 26
  difficulties:
    normal: {name: Normal, tier: 1, bank: {every: 2, rest: true, keep: 1.0, treasure: true, exit: 0.5}, advice: "Made for this act's roleplay gear."}
    hard: {name: Hard, tier: 2, health: 1.5, damage: 1.25, needs: normal, bank: {rest: true, keep: 0.5, treasure: true, exit: 0.5}, minutes: 45, par: 34, advice: "Made for rare dungeon gear."}
    nightmare: {name: Nightmare, tier: 3, health: 2.2, damage: 1.6, needs: hard, bank: {keep: 0, exit: 0.5}, minutes: 55, par: 42, advice: "Made for epic and legendary dungeon gear."}
    mythic: {name: Mythic, tier: 4, health: 3.0, damage: 2.0, needs: nightmare, bank: {keep: 0, exit: 0.5}, gear-at-risk: true, boost: 2.0, minutes: 66, par: 50, advice: "For the best-geared: your worn dungeon gear is at stake."}

# The Seithr warband (6-10): the longest run, only the big halls, and the toughest boss.
