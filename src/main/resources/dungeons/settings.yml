# Dungeon run settings. Shipped once; never overwritten. /tr dungeon reload applies changes.
# Most runs at once; gates refuse more until one ends.
max-runs: 4
# Seconds between entering a fight room and its doors sealing (a solo player seals at once).
countdown-seconds: 4
# Seconds before a boss fight, counted once every playing member is in the boss room.
boss-countdown-seconds: 5
# Seconds a downed player waits; then a shared life brings them back at the last safe room.
bleed-out-seconds: 30
# Seconds a party member crouches within revive-radius blocks to bring a downed player back.
revive-seconds: 3
revive-radius: 2.5
# A downed player nobody can revive (solo, or the rest of the party is out or offline) crouches this
# many seconds to get back up, once per fight room; after that they wait alone-bleed-out-seconds,
# then a shared life brings them back.
self-revive-seconds: 5
alone-bleed-out-seconds: 10
# Party members within this many blocks of the gate come along.
gate-radius: 8
# Seconds a disconnected player keeps their place in the run.
disconnect-grace-seconds: 300
# Seconds after a run is won before everyone still inside is sent back.
finish-seconds: 60
# Seconds a freed dungeon is held for the next party in line before it goes to the one after.
queue-hold-seconds: 60
# No friendly fire of any kind in dungeons. Heals, shields, cleanses, buff potions, damage, throws,
# pulls and debuff potions are sorted automatically; MythicMobs auras are sorted by these names.
# harmful-auras: statuses players never put on each other here.
harmful-auras: [Slowed, Weakened, Wounded, Silenced, Silence_Struck, Burnt, Frozen, Stun_Aura, Vine_Wave_Stun, TFMC_Guard_Vibrative_Strike_STUN, Sanguine_Chain_Lock, Glacial_Quills_Stack]
# helpful-auras: buffs players never put on mobs here.
helpful-auras: [guardian_angel, Guardian_Angel_Ward, TFMC_Guard_Shield_Wall_Ward, Rhapsody_aura, Angelic_Serenade_aura, TFMC_Guard_Restoration]
# Commands players can't use inside the dungeon world (staff can).
blocked-commands: [home, homes, sethome, spawn, warp, tpa, tpahere, tpaccept, back, rtp]
