# Dungeon run settings. Shipped once; never overwritten. /tr dungeon reload applies changes.
# Most runs at once; gates refuse more until one ends.
max-runs: 4
# Seconds between entering a fight room and its doors sealing (a solo player seals at once).
countdown-seconds: 4
# Seconds before a boss fight, counted once every playing member is in the boss room.
boss-countdown-seconds: 5
# Seconds a downed player waits; then a shared life brings them back at the last safe room.
bleed-out-seconds: 30
# Seconds a party member crouches within revive-radius blocks to bring a downed player back.
revive-seconds: 3
revive-radius: 2.5
# A downed player nobody can revive (solo, or the rest of the party is out or offline) crouches this
# many seconds to get back up, once per fight room; after that they wait alone-bleed-out-seconds,
# then a shared life brings them back.
self-revive-seconds: 5
alone-bleed-out-seconds: 10
# A party that gets nowhere for this many seconds (no new room, no fight) is told the way on once,
# in chat and with snow particles at the doorway; the next hint waits twice as long.
hint-seconds: 60
# Seconds the entrance room stays shut while the party gets ready: players put on a loadout from
# their dungeon locker (or keep their own gear) and say they are ready; the doors open as soon as
# everyone is. 0 = no lobby: the doors open at once and loadouts can't be worn.
lobby-seconds: 120
# Party members within this many blocks of the gate come along.
gate-radius: 8
# Seconds a disconnected player keeps their place in the run.
disconnect-grace-seconds: 300
# Seconds after a run is won before everyone still inside is sent back.
finish-seconds: 60
# Seconds a freed dungeon is held for the next party in line before it goes to the one after.
queue-hold-seconds: 60
# No friendly fire of any kind in dungeons. Heals, shields, cleanses, buff potions, damage, throws,
# pulls and debuff potions are sorted automatically; MythicMobs auras are sorted by these names.
# harmful-auras: statuses players never put on each other here.
harmful-auras: [Slowed, Weakened, Wounded, Silenced, Silence_Struck, Burnt, Frozen, Stun_Aura, Vine_Wave_Stun, TFMC_Guard_Vibrative_Strike_STUN, Sanguine_Chain_Lock, Glacial_Quills_Stack]
# helpful-auras: buffs players never put on mobs here.
helpful-auras: [guardian_angel, Guardian_Angel_Ward, TFMC_Guard_Shield_Wall_Ward, Rhapsody_aura, Angelic_Serenade_aura, TFMC_Guard_Restoration]
# Weekly affixes: the weeks (UTC, Monday to Monday, the same on every server) go through the pool in
# turns, each affix leading once a turn and never two weeks running. A run gets as many as per-tier
# gives its tier (Hard is tier 2, Nightmare 3, so Nightmare always has Hard's affix and one more).
# The gate's difficulty screen shows them.
#   fortified: ordinary enemies' health; tyrannical: bosses' health and damage;
#   volatile: every enemy bursts soon after it dies (the kit's burst numbers);
#   raging: enemies below this share of their health hit this much harder;
#   bolstering: each death within radius blocks adds this much damage to the enemies near it.
affixes:
  pool: [fortified, tyrannical, volatile, raging, bolstering]
  per-tier: {2: 1, 3: 2, 4: 2}
  fortified: 1.25
  tyrannical: {health: 1.3, damage: 1.15}
  raging: {below: 0.3, damage: 1.25}
  bolstering: {damage: 0.1, radius: 12}
# The most max health the server lets a mob have (spigot.yml settings.attribute.maxHealth.max). Big
# bosses scaled past it take that much less damage instead, so they are as tough as meant.
max-health: 2048
# Commands players can't use inside the dungeon world (staff can).
blocked-commands: [home, homes, sethome, spawn, warp, tpa, tpahere, tpaccept, back, rtp]

# Enemy attacks, the same in every dungeon. An enemy's MythicMobs skill starts an attack with
# dungeonattack{windup=..;recover=..;guard=..;poise=..;magic=..;ground=..;strike=..}: it winds up to the
# animation's hit frame, strikes, then stands open for recover ticks. open-bonus: extra damage it takes
# while open, by difficulty tier (Normal first). stagger-ticks: how much longer an attack broken off (by
# enough damage in its windup, or a status) leaves it open. interrupt-auras break a spell's windup,
# stagger-auras any windup. Each level of Slowness (slowness-step) and slow-auras stretch a windup, at most
# max-slow times. cues: the MythicMobs skills that show the colour code (dodge orange, leave red, interrupt
# blue, open white, break: the attack animation stops when it is broken off, clear).
combat:
  open-bonus: [0.4, 0.35, 0.3, 0.25]
  stagger-ticks: 30
  interrupt-auras: [Silenced, Frozen, Stun_Aura]
  stagger-auras: [Frozen, Stun_Aura]
  slow-auras: {}
  slowness-step: 0.2
  max-slow: 2
  cues: {dodge: TR_Cue_Dodge, leave: TR_Cue_Leave, interrupt: TR_Cue_Interrupt, open: TR_Cue_Open, break: TR_Cue_Break, clear: TR_Cue_Clear}
