# Dungeon loot. Shipped once; never overwritten. /tr dungeon reload applies changes.
#
# A dungeon item starts as an AdvancedCrafting recipe made of the act's standard material (so a
# common piece matches what a player crafts this act), then its rarity and the dungeon's tier make
# it stronger and add bonus stats, sockets for dungeon gems, a name and a look. Items are limited to
# the classes their template allows, like crafted gear. They never break and never leave dungeons.

# The act's standard ingredient for each recipe main type (AdvancedCrafting ingredient ids).
# At an act change, move these with it.
standard:
  metal: steel_ingot
  wood: refined_maplewood

# From the most common up. weight: how often (a tier's luck favours the rarer ones); power: how much
# stronger than the standard piece; bonus: extra stats from the item's pool; sockets: empty sockets
# that take dungeon gems; colour: the name's colour.
rarities:
  uncommon: {name: Uncommon, weight: 65, power: 1.15, bonus: 1, sockets: 0, colour: "#5fd35f"}
  rare: {name: Rare, weight: 25, power: 1.3, bonus: 2, sockets: 1, colour: "#4f9cff"}
  epic: {name: Epic, weight: 7, power: 1.5, bonus: 3, sockets: 2, colour: "#b05cff"}
  legendary: {name: Legendary, weight: 3, power: 1.75, bonus: 4, sockets: 3, colour: "#ff9c2a"}

# Dungeon tiers (a recipe's tier). power multiplies with the rarity's; luck makes each step up the
# rarity list (1 + luck) times as likely.
tiers:
  1: {power: 1.0, luck: 0}
  2: {power: 1.25, luck: 0.5}
  3: {power: 1.55, luck: 1.0}

# The socket colour dungeon items carry: only dungeon gems fit it (TLibs socket-tier-groups).
socket: Dungeon Gem

# Stats rarity and tier never change: how a weapon handles, not how strong it is.
unscaled: [movement_speed, attack_speed, arrow_velocity, entity_interaction_range, critical_strike_chance, blunt_power]

# Bonus stats. Every pick is worth the same, so no roll is better than another: each bonus stat
# gives bonus-worth [min, max] units at tier 1 (before the rarity's power), and worth says what one
# unit of each stat is. The units follow GemInfusion's basic gems (a common basic gem of each stat,
# mid-roll), the server's own measure of what stats are worth to each other.
bonus-worth: [2, 4]
worth:
  max_health: 0.25
  armor: 0.075
  physical_damage_reduction: 1.1
  projectile_damage_reduction: 1.1
  magic_damage_reduction: 1.1
  physical_damage: 2.1
  projectile_damage: 2.1
  magic_damage: 2.1
  lifesteal: 2.1

# Bonus stat pools: the stats each kind of item can roll.
bonus:
  armour: [max_health, armor, physical_damage_reduction, projectile_damage_reduction, magic_damage_reduction]
  melee: [physical_damage, max_health, lifesteal, physical_damage_reduction]
  ranged: [projectile_damage, max_health, lifesteal, projectile_damage_reduction]
  jewellery: [max_health, physical_damage, projectile_damage, magic_damage, physical_damage_reduction,
    projectile_damage_reduction, magic_damage_reduction]

# What runs hand out. Personal loot: each player rolls their own, for their own class, straight into
# their locker. chance: the chance of an item at each moment (vault, boss, elite room, room event);
# gem-chance: the share of won rolls that give a dungeon gem instead; pity: added to the next chance
# after each roll that gives nothing (back to 0 on a win). marks: dungeon marks each moment pays,
# spent in the locker's shop at prices (by rarity; items are made at shop-tier). weekly: each
# character rolls items from runs: runs of each dungeon a week (later runs pay marks only) and earns
# at most marks: marks a week. gems: the MMOItems gem template and the bonus pool of their one stat.
rewards:
  chance: {vault: 1.0, boss: 0.35, elite: 0.1, event: 0.15}
  gem-chance: 0.25
  pity: 0.1
  marks: {vault: 10, boss: 5, elite: 2, event: 2}
  weekly: {runs: 3, marks: 60}
  prices: {rare: 30, epic: 80}
  shop-tier: 1
  gems: {template: gemstones.larimar, pool: jewellery}
  # Reaching the vault within the run's par time (recipes.yml par:): extra marks (inside the weekly
  # cap) and extra luck for the vault's roll (0.5 makes Normal roll like Hard and Hard like Nightmare).
  par: {marks: 5, luck: 0.5}

# Spoils: what leaves the dungeon with the player (never dungeon gear). A dungeon is a run source of
# the act system (ACT-SYSTEM.md rule 5): an hour of proper play pays a full act budget and a full
# rare budget, like an hour of mining or extreme infestations. Each cleared fight room pays its share
# of the recipe's minutes; they wait in the locker and are the player's once back outside.
# per-hour: item (TLibs path; gem = one gem pouch from gems; denars = coins) to how many a proper
# player earns in an hour. Act 1 at the 1:40 step: Ignitium 18.9, iron ~1.15 per Ignitium, tin and
# abyssalite fragment 18.9 / 40 each; rare items 69.1 IE: gem pouches in extreme infestations' mix,
# dust at Ignitium / 40, ~85 denars. At each act change or step, move these with the act system.
spoils:
  per-hour:
    - {item: m.materials.ignitium, amount: 18.9}
    - {item: v.iron_ingot, amount: 21.7}
    - {item: m.materials.raw_tin, amount: 0.47}
    - {item: m.materials.abyssalite_fragment, amount: 0.47}
    - {item: m.currency.enchanted_dust, amount: 0.47}
    - {item: gem, amount: 21.2}
    - {item: denars, amount: 85}
  gems:
    - {item: m.loot.basic_gemstone_pouch, weight: 60}
    - {item: m.loot.polished_gemstone_pouch, weight: 23}
    - {item: m.loot.radiant_gemstone_pouch, weight: 11}
    - {item: m.loot.mythical_gemstone_pouch, weight: 6}
  coins:
    - {item: m.currency.pouch_of_coins, value: 100}
    - {item: m.currency.stack_of_coins, value: 10}
    - {item: m.currency.handful_of_coins, value: 5}
    - {item: m.currency.gold_coin, value: 1}

# Cosmetics that leave dungeons (bragging, not strength). They roll only on runs that still roll
# items this week (the weekly limit), on the run's difficulty. trophies: the boss may drop one, an
# item (TLibs path; meant to be ItemsAdder trophy furniture) named for the feat, with the date and
# the party; it waits in the locker like spoils. skins: the vault may unlock an ArmourShop set the
# player doesn't have yet, by running unlock-command ({player}, {permission}) on the console.
# The items and permissions below are placeholders until the trophy furniture and the dungeon skin
# sets exist.
cosmetics:
  unlock-command: "lp user {player} permission set {permission} true"
  trophies:
    - {recipe: delve_seithr, difficulty: normal, chance: 0.05, item: v.skeleton_skull, name: "Ice Golem Trophy"}
    - {recipe: delve_seithr, difficulty: hard, chance: 0.08, item: v.skeleton_skull, name: "Ice Golem Trophy (Hard)"}
    - {recipe: delve_seithr, difficulty: nightmare, chance: 0.12, item: v.wither_skeleton_skull, name: "Ice Golem Trophy (Nightmare)"}
  skins:
    - {recipe: delve_seithr, difficulty: hard, chance: 0.03, permission: armourshop.dungeon.seithr_frost, name: "Seithr Frost"}
    - {recipe: delve_seithr, difficulty: nightmare, chance: 0.05, permission: armourshop.dungeon.seithr_frost, name: "Seithr Frost"}
    - {recipe: delve_seithr, difficulty: nightmare, chance: 0.03, permission: armourshop.dungeon.seithr_glacial, name: "Seithr Glacial"}

# What can drop. recipe: an AdvancedCrafting recipe; template: an MMOItems template (file.id) with
# its own stats: [min, max]. %material% in the name is where a prefix goes.
items:
  light_helmet: {recipe: light_helmet, slot: helmet, pool: armour, look: light, name: "Light %material% Helmet"}
  light_chestplate: {recipe: light_chestplate, slot: chestplate, pool: armour, look: light, name: "Light %material% Chestplate"}
  light_leggings: {recipe: light_leggings, slot: leggings, pool: armour, look: light, name: "Light %material% Leggings"}
  light_boots: {recipe: light_boots, slot: boots, pool: armour, look: light, name: "Light %material% Boots"}
  medium_helmet: {recipe: medium_helmet, slot: helmet, pool: armour, look: medium, name: "Medium %material% Helmet"}
  medium_chestplate: {recipe: medium_chestplate, slot: chestplate, pool: armour, look: medium, name: "Medium %material% Chestplate"}
  medium_leggings: {recipe: medium_leggings, slot: leggings, pool: armour, look: medium, name: "Medium %material% Leggings"}
  medium_boots: {recipe: medium_boots, slot: boots, pool: armour, look: medium, name: "Medium %material% Boots"}
  heavy_helmet: {recipe: heavy_helmet, slot: helmet, pool: armour, look: heavy, name: "Heavy %material% Helmet"}
  heavy_chestplate: {recipe: heavy_chestplate, slot: chestplate, pool: armour, look: heavy, name: "Heavy %material% Chestplate"}
  heavy_leggings: {recipe: heavy_leggings, slot: leggings, pool: armour, look: heavy, name: "Heavy %material% Leggings"}
  heavy_boots: {recipe: heavy_boots, slot: boots, pool: armour, look: heavy, name: "Heavy %material% Boots"}
  infantry_helmet: {recipe: infantry_helmet, slot: helmet, pool: armour, look: infantry, name: "Infantry %material% Cap"}
  infantry_chestplate: {recipe: infantry_chestplate, slot: chestplate, pool: armour, look: infantry, name: "Infantry %material% Jacket"}
  infantry_leggings: {recipe: infantry_leggings, slot: leggings, pool: armour, look: infantry, name: "Infantry %material% Leggings"}
  infantry_boots: {recipe: infantry_boots, slot: boots, pool: armour, look: infantry, name: "Infantry %material% Boots"}
  sword: {recipe: sword, slot: weapon, pool: melee, name: "%material% Sword"}
  battleaxe: {recipe: battleaxe, slot: weapon, pool: melee, name: "%material% Battleaxe"}
  dagger: {recipe: dagger, slot: weapon, pool: melee, name: "%material% Dagger"}
  warhammer: {recipe: warhammer, slot: weapon, pool: melee, name: "%material% Warhammer"}
  spear: {recipe: spear, slot: weapon, pool: melee, name: "%material% Spear"}
  polearm: {recipe: polearm, slot: weapon, pool: melee, name: "%material% Polearm"}
  longsword: {recipe: longsword, slot: weapon, pool: melee, name: "%material% Longsword"}
  greathammer: {recipe: greathammer, slot: weapon, pool: melee, name: "%material% Greathammer"}
  greataxe: {recipe: greataxe, slot: weapon, pool: melee, name: "%material% Greataxe"}
  shortbow: {recipe: shortbow, slot: weapon, pool: ranged, name: "%material% Shortbow"}
  crossbow: {recipe: crossbow, slot: weapon, pool: ranged, name: "%material% Crossbow"}
  longbow: {recipe: longbow, slot: weapon, pool: ranged, name: "%material% Longbow"}
  ring: {template: ring.fine_jeweled_ring, slot: ring, pool: jewellery, name: "%material% Ring", stats: {max_health: [0.4, 0.8]}}
  amulet: {template: amulet.fine_pendant_amulet, slot: amulet, pool: jewellery, name: "%material% Amulet", stats: {max_health: [0.4, 0.8]}}

# Names: a prefix in place of the material; epic and legendary items also get a suffix.
names:
  prefixes: [Rimebound, Frostwoven, Seithr, Hoarfrost, Glacial, Winterborn, Icebound, Palefrost, Snowmantled, Coldiron]
  suffixes: [of the Thaw, of the Long Night, of Frozen Oaths, of the Frost Host, of Seithrin, of the Still Wind, of the White Silence, of Bitter Winds]

# Armour skins: for each rarity and armour weight (an item's look), the ItemsAdder sets it may wear
# (ia.tfmc_armor:<set>_<piece>). Rarer items get the finer metals.
looks:
  uncommon:
    light: [hraftar_iron_light, imperial_iron_light, forestman_steel_light]
    medium: [hraftar_iron_medium, imperial_iron_medium, forestman_steel_medium]
    heavy: [hraftar_iron_heavy, imperial_iron_heavy, forestman_steel_heavy]
    infantry: [base_metal_steel_infantry]
  rare:
    light: [hraftar_abyssalite_light, imperial_abyssalite_light, forestman_abyssalite_light]
    medium: [hraftar_abyssalite_medium, imperial_abyssalite_medium, forestman_abyssalite_medium]
    heavy: [hraftar_abyssalite_heavy, imperial_abyssalite_heavy, forestman_abyssalite_heavy]
    infantry: [base_metal_abyssalite_infantry]
  epic:
    light: [hraftar_mythril_light, imperial_mythril_light, forestman_mythril_light, scale_light]
    medium: [hraftar_mythril_medium, imperial_mythril_medium, forestman_mythril_medium]
    heavy: [hraftar_mythril_heavy, imperial_mythril_heavy, forestman_mythril_heavy, scale_heavy]
    infantry: [base_metal_mythril_infantry]
  legendary:
    light: [dwarven_light, malevorian_light, brightsteel_light]
    medium: [dwarven_medium, cervalic_order_medium, malevorian_medium]
    heavy: [dwarven, cervalic_order_heavy, malevorian, brightsteel_heavy]
    infantry: [base_metal_mythril_infantry]
