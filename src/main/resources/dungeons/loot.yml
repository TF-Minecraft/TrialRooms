  medal: {template: artifact.good_medal, slot: artifact, pool: jewellery, look: [medal], name: "%material% Medal", stats: {max_health: [0.4, 0.8]}}
  chalice: {template: artifact.good_chalice, slot: artifact, pool: jewellery, look: [chalice], name: "%material% Chalice", stats: {max_health: [0.4, 0.8]}}
  mirror: {template: artifact.good_mirror, slot: artifact, pool: jewellery, look: [mirror], name: "%material% Mirror", stats: {max_health: [0.4, 0.8]}}

# Names: prefixes are for gems (items take their set's name); epic and legendary items also get a suffix.
names:
  prefixes: [Deepstone, Lanternlit, Vaultborn, Sealed, Hollow, Buried, Forgotten, Candleworn, Ironbound, Dustbound]
  suffixes: [of the Long Dark, of the Last Lantern, of Sealed Doors, of the Deep Vault, of Old Oaths, of the Quiet Halls, of Fallen Stone, of the Unopened Gate]

# Looks: where a set's looks are (TLibs item paths): this, the set's id, _ and the item's look.
looks: "ia.tfmc_dungeons:"

# Gear sets. An item belongs to a set of its rarity. dungeons: the recipes it drops in (none: any).
# armour and jewellery: bonuses at so many pieces, in bonus units (worth, above) times the pieces'
# power; armour at 2 and 4 of its helmet, chestplate, leggings and boots, jewellery at 2 and 4 of its
# ring, amulet and two artifacts. trait: what its weapons do (kind and how much), stronger by half
# with 2 pieces of its armour; off-hand pieces give two fifths of it. Every set's bonuses add up to the
# same units (damage raises physical, projectile and magic damage alike and counts once, as each class
# deals one), and the traits are meant to be worth the same.
sets:
  delver:
    name: Delver
    rarity: uncommon
    dungeons: []
    armour: {2: {max_health: 3}, 4: {armor: 3, max_health: 3}}
    jewellery: {2: {max_health: 2}, 4: {lifesteal: 2, max_health: 2}}
    trait: {kind: opening, value: 0.15}
  sellsword:
    name: Sellsword
    rarity: uncommon
    dungeons: []
    armour: {2: {damage: 3}, 4: {damage: 6}}
    jewellery: {2: {lifesteal: 2}, 4: {damage: 4}}
    trait: {kind: execute, value: 0.12}
  warden:
    name: Warden
    rarity: rare
    dungeons: []
    armour: {2: {armor: 3}, 4: {physical_damage_reduction: 3, max_health: 3}}
    jewellery: {2: {physical_damage_reduction: 2}, 4: {max_health: 4}}
    trait: {kind: ward, value: 0.1}
  gravebound:
    name: Gravebound
    rarity: rare
    dungeons: []
    armour: {2: {lifesteal: 3}, 4: {max_health: 4, lifesteal: 2}}
    jewellery: {2: {lifesteal: 2}, 4: {magic_damage_reduction: 2, max_health: 2}}
    trait: {kind: mend, value: 0.05}
  ember:
    name: Emberforged
    rarity: epic
    dungeons: []
    armour: {2: {damage: 3}, 4: {damage: 6}}
    jewellery: {2: {damage: 2}, 4: {damage: 4}}
    trait: {kind: burn, value: 0.4}
  duskwoven:
    name: Duskwoven
    rarity: epic
    dungeons: []
    armour: {2: {damage: 3}, 4: {damage: 4, projectile_damage_reduction: 2}}
    jewellery: {2: {damage: 2}, 4: {damage: 2, max_health: 2}}
    trait: {kind: composed, value: 0.1}
  drowned:
    name: Drowned Crown
    rarity: legendary
    dungeons: []
    armour: {2: {magic_damage_reduction: 3}, 4: {max_health: 4, armor: 2}}
    jewellery: {2: {magic_damage_reduction: 2}, 4: {max_health: 2, armor: 2}}
    trait: {kind: chill, value: 2}
  firstlight:
    name: Firstlight
    rarity: legendary
    dungeons: []
    armour: {2: {max_health: 3}, 4: {max_health: 3, damage: 3}}
    jewellery: {2: {max_health: 2}, 4: {damage: 4}}
    trait: {kind: radiance, value: 0.02}
  garrison:
    name: Seithr Garrison
    rarity: uncommon
    dungeons: [delve_seithr, dungeon_seithr, warband_seithr]
    armour: {2: {armor: 3}, 4: {armor: 3, projectile_damage_reduction: 3}}
    jewellery: {2: {armor: 2}, 4: {max_health: 4}}
    trait: {kind: brace, value: 0.08}
  court:
    name: Seithr Court
    rarity: rare
    dungeons: [delve_seithr, dungeon_seithr, warband_seithr]
    armour: {2: {damage: 3}, 4: {damage: 3, armor: 3}}
    jewellery: {2: {damage: 2}, 4: {lifesteal: 4}}
    trait: {kind: duel, value: 0.12}
  marquis:
    name: Seithr Marquis
    rarity: epic
    dungeons: [delve_seithr, dungeon_seithr, warband_seithr]
    armour: {2: {physical_damage_reduction: 3}, 4: {magic_damage_reduction: 3, max_health: 3}}
    jewellery: {2: {projectile_damage_reduction: 2}, 4: {max_health: 2, armor: 2}}
    trait: {kind: rime, value: 2}
  royal:
    name: Seithr Royal
    rarity: legendary
    dungeons: [delve_seithr, dungeon_seithr, warband_seithr]
    armour: {2: {damage: 3}, 4: {damage: 6}}
    jewellery: {2: {max_health: 2}, 4: {damage: 4}}
    trait: {kind: shards, value: 0.4}
